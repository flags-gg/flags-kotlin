name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Build
        run: ./gradlew build
      - name: Run tests
        run: ./gradlew test
      - name: Publish to Maven Central
        # publish signs the artifacts into the plugin's stage; publishToMavenCentral zips and uploads that stage.
        # Gradle's in-memory signing only accepts the short (8 hex) key id, so trim a full fingerprint in keyId.
        run: |
          SIGNING_SETUP="$(printf '%s' "$SIGNING_SETUP_RAW" | jq -c '.keyId |= (if type == "string" and length > 8 then .[-8:] else . end)')"
          export SIGNING_SETUP
          ./gradlew publish publishToMavenCentral
        env:
          SIGNING_SETUP_RAW: ${{ secrets.MAVEN_CENTRAL_PUBLISH_GPG }}
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_PUBLISH_USER: ${{ secrets.MAVEN_USERNAME }}
